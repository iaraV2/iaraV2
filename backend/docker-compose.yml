services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iara-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/chat
      - GOOGLE_APPLICATION_CREDENTIALS=/backend/chaveJsonFirebaseFirestore.json
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      
      # - OLLAMA_HOST=http://ollama:11434   # ❌ comentado (não usa ollama)

    volumes:
      - ./chaveJsonFirebaseFirestore.json:/backend/chaveJsonFirebaseFirestore.json
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   - ollama   # ❌ comentado (serviço não existe mais)
    networks:
      - iara-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: iara-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # ← CORRETO
    depends_on:
      - backend
    networks:
      - iara-network

